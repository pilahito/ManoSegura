name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PS (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4

      - name: Instalar modulos
        shell: ${{ matrix.shell }}
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Force -SkipPublisherCheck -RequiredVersion 5.7.1 -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Analisis estatico (PSScriptAnalyzer)
        shell: ${{ matrix.shell }}
        run: |
          Import-Module PSScriptAnalyzer
          $resultados = Invoke-ScriptAnalyzer -Path . -Settings ./PSScriptAnalyzerSettings.psd1 -Recurse
          $resultados | Format-Table -AutoSize
          if ($resultados.Count -gt 0) { throw "PSScriptAnalyzer: $($resultados.Count) aviso(s)" }

      - name: Tests (Pester)
        shell: ${{ matrix.shell }}
        run: |
          Import-Module Pester -MinimumVersion 5.0
          $resultado = Invoke-Pester -Path ./tests -Output Detailed -PassThru
          if ($resultado.FailedCount -gt 0) { throw "$($resultado.FailedCount) test(s) fallaron" }
